AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions deployment role scoped to one repository and environment
Parameters:
  Repository:
    Type: String
    Description: GitHub owner/repository
  OidcProviderArn:
    Type: String
    Description: Existing IAM OIDC provider for https://token.actions.githubusercontent.com (audience sts.amazonaws.com)
  ClusterName:
    Type: String
  ServerServiceName:
    Type: String
  ClientServiceName:
    Type: String
  ExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref OidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${Repository}:environment:Production'
      Policies:
        - PolicyName: DeployApplication
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/social-media-server'
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/social-media-client'
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${ServerServiceName}'
                  - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${ClientServiceName}'
              - Effect: Allow
                Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!Ref ExecutionRoleArn, !Ref TaskRoleArn]
                Condition:
                  StringEquals: {iam:PassedToService: ecs-tasks.amazonaws.com}
Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
