name: Deploy AWS
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      SERVER_SERVICE: ${{ vars.ECS_SERVER_SERVICE }}
      CLIENT_SERVICE: ${{ vars.ECS_CLIENT_SERVICE }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify container startup
        run: node --test server/test/docker-entrypoint.test.cjs
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION ECS_CLUSTER SERVER_SERVICE CLIENT_SERVICE APP_URL; do
            test -n "${!name}" || { echo "Missing variable: $name"; exit 1; }
          done
          [[ "$APP_URL" == https://* && "$APP_URL" != */ ]] || { echo 'APP_URL must use HTTPS with no trailing slash'; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build server
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/social-media-server:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build client
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_API_URL=${{ vars.APP_URL }}
          tags: ${{ steps.ecr.outputs.registry }}/social-media-client:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy services and verify exact revisions
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for component in server client; do
            if [[ "$component" == server ]]; then service="$SERVER_SERVICE"; else service="$CLIENT_SERVICE"; fi
            current=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" --query 'services[0].taskDefinition' --output text)
            aws ecs describe-task-definition --task-definition "$current" --query taskDefinition > old-task.json
            jq --arg name "$component" --arg image "$REGISTRY/social-media-$component:$IMAGE_TAG" '
              del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
              | (.containerDefinitions[] | select(.name == $name) | .image) = $image
            ' old-task.json > new-task.json
            revision=$(aws ecs register-task-definition --cli-input-json file://new-task.json --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$service" --task-definition "$revision" > /dev/null
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$service"
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" > service.json
            jq -e --arg revision "$revision" '
              .services[0] | .taskDefinition == $revision and .runningCount == 1
              and (.deployments | length == 1) and .deployments[0].rolloutState == "COMPLETED"
            ' service.json > /dev/null
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$APP_URL/api/health"
          curl --fail --silent --show-error --output /dev/null "$APP_URL/login"
          echo "Deployed image tag: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
